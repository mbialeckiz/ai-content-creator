<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forces DC Content Studio</title>
  <!-- Montserrat z pliku w aplikacji, nie z sieci: grafika ma wyglądać tak
       samo na każdym komputerze i działać bez internetu. Krój zmienny, więc
       jeden plik obsługuje wszystkie grubości. Licencja: patrz
       app/static/kroje/LICENCJA.md -->
  <style>
    @font-face {
      font-family: "Montserrat";
      src: url("/static/kroje/montserrat.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
  </style>
  <link rel="stylesheet" href="/static/styl.css" />
  <!-- Ikona wpisana w adres, nie osobny plik — inaczej przeglądarka pyta
       o /favicon.ico przy każdym wejściu i dostaje 404. -->
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E2127'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial,sans-serif' font-size='15' font-weight='bold' fill='%23C2A470' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E"
  />
</head>
<body>
  <!-- Ikony jako inline SVG — bez zewnętrznych bibliotek i bez build stepu
       (CLAUDE.md). Symbole wstawiane przez <use> w nawigacji. -->
  <svg style="display:none" aria-hidden="true">
    <symbol id="ikona-asystent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-4-.9L3 21l1.9-4.6A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/>
    </symbol>
    <symbol id="ikona-plan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
    </symbol>
    <symbol id="ikona-posty" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 3h11l5 5v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>
    </symbol>
    <symbol id="ikona-materialy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </symbol>
    <symbol id="ikona-styl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19l7-7a2.8 2.8 0 0 0-4-4l-7 7-1 5z"/><path d="M5 21h6"/>
    </symbol>
    <symbol id="ikona-korpus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 8h5M8 12h8M8 16h8"/>
    </symbol>
    <symbol id="ikona-diagnostyka" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 11l2 2 4-4"/><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6z"/>
    </symbol>
  </svg>

  <div class="uklad">
    <header class="naglowek">
      <h1>Forces DC Content Studio</h1>
      <!-- Pasek trwających operacji jest POZA obszarem głównym, bo tylko
           dzięki temu przeżywa przełączenie zakładki (zakładka podmienia
           zawartość <main>, nagłówka nie rusza). -->
      <div class="pasek-operacji" id="pasek-operacji" hidden></div>
      <span class="zuzycie">Wydano w tej sesji: 0.00 USD</span>
    </header>

    <nav class="nawigacja">
      <ul id="lista-zakladek">
        <li><button class="zakladka" data-zakladka="asystent"><svg class="ikona"><use href="#ikona-asystent"/></svg>Asystent</button></li>
        <li><button class="zakladka" data-zakladka="plan"><svg class="ikona"><use href="#ikona-plan"/></svg>Plan</button></li>
        <li><button class="zakladka" data-zakladka="posty"><svg class="ikona"><use href="#ikona-posty"/></svg>Posty</button></li>
        <li><button class="zakladka" data-zakladka="materialy"><svg class="ikona"><use href="#ikona-materialy"/></svg>Materiały</button></li>
        <li><button class="zakladka" data-zakladka="styl"><svg class="ikona"><use href="#ikona-styl"/></svg>Styl</button></li>
        <li><button class="zakladka" data-zakladka="korpus"><svg class="ikona"><use href="#ikona-korpus"/></svg>Korpus</button></li>
      </ul>
      <div class="diagnostyka-link">
        <button data-zakladka="diagnostyka"><svg class="ikona" style="width:15px;height:15px"><use href="#ikona-diagnostyka"/></svg>Sprawdź środowisko</button>
      </div>
    </nav>

    <main class="obszar-glowny" id="obszar-glowny">
      <!-- Zawartość wstrzykiwana przez app.js -->
    </main>
  </div>

  <script src="/static/grafika.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
