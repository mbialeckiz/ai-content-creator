# Identyfikacja wizualna Forces DC — używana przy tworzeniu grafik do postów.
#
# Ten plik edytujesz w aplikacji (zakładka Styl → Identyfikacja wizualna).
# Kolory podawaj jako kody szesnastkowe, np. #1E2127.
#
# Wartości odczytane ze strony forces.no (lipiec 2026) na podstawie zrzutów
# ekranu. Odczyt z obrazu jest bliski, ale nie co do bitu — jeśli macie
# oficjalną księgę znaku z dokładnymi kodami, podmieńcie je tutaj.

nazwa_firmy: Forces DC
podpis: Special Forces For Nordic Data Center Industry

kolory:
  # Ciemna grafitowa podstawa, na której zbudowana jest cała strona.
  tlo: "#1E2127"
  tekst: "#FFFFFF"
  # Stonowane złoto — jedyny kolor akcentu na stronie. Występuje w logo
  # (człon „DC"), przyciskach „Let's Talk" i „More About Us" oraz ikonach.
  akcent: "#C2A470"
  # Jasna sekcja ze strony („Custom-fit manpower solutions").
  tlo_alternatywne: "#EAEAEA"
  tekst_alternatywny: "#1E2127"

# Nagłówki na stronie są złożone geometrycznym groteskiem o dwupiętrowym „a".
# Nie znam nazwy tego kroju z samego obrazu, więc podstawiam najbliższy krój
# dostępny na każdym Macu. Jeśli księga znaku podaje właściwą nazwę, wpisz ją
# na początku listy — reszta zostanie jako zabezpieczenie.
kroje:
  naglowek: "Avenir Next, Avenir, Helvetica Neue, Helvetica, sans-serif"
  podpis: "Avenir Next, Avenir, Helvetica Neue, Helvetica, sans-serif"

# Logo: biały napis FORCES z członem DC w kolorze akcentu, litery rozstrzelone
# i lekko techniczne. Wgraj plik przez zakładkę Styl → Identyfikacja wizualna,
# a potem wpisz tu jego nazwę. Strona używa wersji na ciemnym tle.
logo:
  plik: ""
  plik_na_ciemnym: ""
  wysokosc_px: 64

format:
  szerokosc: 1200
  wysokosc: 1200
