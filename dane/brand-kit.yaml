# Identyfikacja wizualna Forces DC — używana przy tworzeniu grafik do postów.
#
# Ten plik edytujesz w aplikacji (zakładka Styl → Identyfikacja wizualna).
# Kolory podawaj jako kody szesnastkowe, np. #32373C.
#
# Kolory pochodzą z paczki brand kitu dostarczonej przez klientkę (sierpień
# 2026) — cztery kody: #BBA470, #32373C, #000000, #FFFFFF. Same kody były
# podane bez opisu ról, więc przypisanie poniżej wynika z wyglądu strony
# forces.no. Jeśli księga znaku mówi inaczej, popraw tutaj.

nazwa_firmy: Forces DC
podpis: Special Forces For Nordic Data Center Industry

kolory:
  # Grafitowa podstawa — dominujący kolor strony i grafik.
  tlo: "#32373C"
  tekst: "#FFFFFF"
  # Stonowane złoto — jedyny kolor akcentu. Występuje w logo (człon „DC"),
  # przyciskach i ikonach.
  akcent: "#BBA470"
  # Wariant jasny. Paleta marki nie zawiera szarości, więc jasna wersja
  # grafiki to biel z czarnym tekstem, a nie odcień szarego.
  tlo_alternatywne: "#FFFFFF"
  tekst_alternatywny: "#000000"
  # Czarny pasek u dołu jasnych grafik, z wyśrodkowanym znakiem — element
  # powtarzający się we wszystkich projektach z Canvy.
  pasek_stopki: "#111111"

# W palecie jest też czerń #000000 — głębsza niż grafit, do zastosowań,
# w których grafit jest za jasny. Nie jest dziś używana przez generator
# grafik; wpisz ją jako `tlo`, jeśli chcesz mocniejszego kontrastu.

# Montserrat — krój używany w projektach z Canvy, potwierdzony przez klienta.
# Plik kroju leży w aplikacji (app/static/kroje/), więc grafika wygląda tak
# samo niezależnie od tego, co jest zainstalowane w systemie. Dalsza część
# listy to zabezpieczenie na wypadek, gdyby plik się nie wczytał.
kroje:
  naglowek: "Montserrat, Helvetica Neue, Helvetica, Arial, sans-serif"
  podpis: "Montserrat, Helvetica Neue, Helvetica, Arial, sans-serif"

# Logo: napis FORCES z członem DC w kolorze akcentu. Pliki wyciągnięte
# z paczki PDF od klientki — wektorowe, bez tła, przycięte do samego znaku.
# `plik` to wersja na jasne tło (czarny napis), `plik_na_ciemnym` na ciemne
# (biały napis). Nowe warianty wgrywasz w zakładce Styl.
logo:
  plik: "forces-dc-na-jasnym.svg"
  plik_na_ciemnym: "forces-dc-na-ciemnym.svg"
  # Znak jest bardzo szeroki (proporcja ok. 8,5:1), więc 64 px wysokości daje
  # ok. 540 px szerokości na grafice 1200 px — mniej więcej wypełnia kolumnę.
  wysokosc_px: 64

# Adres wypisywany u góry grafiki. Jest na większości ich projektów i pełni
# rolę podpisu, gdy obraz krąży wyrwany z kontekstu posta. Zostaw puste,
# żeby go nie rysować.
adres_www: "www.forces.no"

# Pion 4:5 — format, w którym powstają projekty w Canvie i który LinkedIn
# pokazuje największy. Kwadrat 1200×1200 zajmował w kanale wyraźnie mniej.
format:
  szerokosc: 1080
  wysokosc: 1350

# Nazwy szablonów w Canvie, do których odwołuje się polecenie generowane
# przyciskiem „Zrób grafikę w Canvie". Muszą się zgadzać z nazwami, pod
# którymi szablony są zapisane na koncie — inaczej Claude ich nie znajdzie
# i złoży projekt od zera.
szablony_canva:
  karuzela: "Forces DC — carousel"
  infografika: "Forces DC — infographic"
  kluczowe-punkty: "Forces DC — key points"
  wydarzenie: "Forces DC — event"
  plansza: "Forces DC — statement"
